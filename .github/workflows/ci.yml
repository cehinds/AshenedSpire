# Ashen Spire CI — docs/design/10 §3.
# 8 jobs, target < 10, hard cap 20. Every job is independent (no `needs:`) so all run concurrently.
name: ci

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main, 'feature/**']

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.6.0f1

jobs:
  version:
    runs-on: ubuntu-latest
    concurrency: { group: ci-${{ github.ref }}-version, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node Tools/version.mjs selftest
      - name: check bump against base
        if: github.event_name == 'pull_request'
        run: node Tools/version.mjs check origin/${{ github.base_ref }} --head-branch "${{ github.head_ref }}" --base-branch "${{ github.base_ref }}"

  docs:
    runs-on: ubuntu-latest
    concurrency: { group: ci-${{ github.ref }}-docs, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node Tools/ci/check-docs.mjs

  content:
    runs-on: ubuntu-latest
    concurrency: { group: ci-${{ github.ref }}-content, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node Tools/ci/check-content.mjs

  domain:
    runs-on: ubuntu-latest
    concurrency: { group: ci-${{ github.ref }}-domain, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-domain-${{ hashFiles('Tests/Domain.Tests/*.csproj') }}
      - run: dotnet test Tests/Domain.Tests/Domain.Tests.csproj -c Release --logger "console;verbosity=normal"

  editmode:
    runs-on: ubuntu-latest
    concurrency: { group: ci-${{ github.ref }}-editmode, cancel-in-progress: true }
    env: { UNITY_LICENSE: '${{ secrets.UNITY_LICENSE }}' }
    steps:
      - name: licence present?
        id: lic
        run: if [ -n "$UNITY_LICENSE" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::UNITY_LICENSE not set — editmode skipped; local batchmode is the gate"; fi
      - uses: actions/checkout@v4
        if: steps.lic.outputs.ok == 'true'
      - uses: actions/cache@v4
        if: steps.lic.outputs.ok == 'true'
        with: { path: Unity/Library, key: library-editmode-${{ env.UNITY_VERSION }}-${{ hashFiles('Unity/Packages/packages-lock.json') }} }
      - uses: game-ci/unity-test-runner@v4
        if: steps.lic.outputs.ok == 'true'
        env: { UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}', UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}' }
        with: { projectPath: Unity, unityVersion: '${{ env.UNITY_VERSION }}', testMode: editmode }

  playmode:
    runs-on: ubuntu-latest
    concurrency: { group: ci-${{ github.ref }}-playmode, cancel-in-progress: true }
    env: { UNITY_LICENSE: '${{ secrets.UNITY_LICENSE }}' }
    steps:
      - name: licence present?
        id: lic
        run: if [ -n "$UNITY_LICENSE" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::UNITY_LICENSE not set — playmode skipped; local batchmode is the gate"; fi
      - uses: actions/checkout@v4
        if: steps.lic.outputs.ok == 'true'
      - uses: actions/cache@v4
        if: steps.lic.outputs.ok == 'true'
        with: { path: Unity/Library, key: library-playmode-${{ env.UNITY_VERSION }}-${{ hashFiles('Unity/Packages/packages-lock.json') }} }
      - uses: game-ci/unity-test-runner@v4
        if: steps.lic.outputs.ok == 'true'
        env: { UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}', UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}' }
        with: { projectPath: Unity, unityVersion: '${{ env.UNITY_VERSION }}', testMode: playmode }

  bot:
    runs-on: ubuntu-latest
    concurrency: { group: ci-${{ github.ref }}-bot, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: seeded headless bot (engine-free)
        run: dotnet test Tests/Domain.Tests/Domain.Tests.csproj -c Release --filter "Category=Bot" -- TestRunParameters.Parameter\(name=\"botSeeds\",value=\"${{ github.ref == 'refs/heads/test' && '200' || '20' }}\"\)

  build-windows:
    if: github.ref == 'refs/heads/test' || github.ref == 'refs/heads/main' || github.base_ref == 'test' || github.base_ref == 'main'
    runs-on: windows-latest
    concurrency: { group: ci-${{ github.ref }}-build-windows, cancel-in-progress: true }
    env: { UNITY_LICENSE: '${{ secrets.UNITY_LICENSE }}' }
    steps:
      - name: licence present?
        id: lic
        shell: bash
        run: if [ -n "$UNITY_LICENSE" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::UNITY_LICENSE not set — Windows build skipped; local batchmode is the gate"; fi
      - uses: actions/checkout@v4
        if: steps.lic.outputs.ok == 'true'
      - uses: game-ci/unity-builder@v4
        if: steps.lic.outputs.ok == 'true'
        env: { UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}', UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}' }
        with: { projectPath: Unity, unityVersion: '${{ env.UNITY_VERSION }}', targetPlatform: StandaloneWindows64, buildMethod: Ashen.EditorTools.Cli.BuildWindows }
